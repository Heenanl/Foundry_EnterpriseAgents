# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# The Genie connection (AzureDatabricksGeniePassthrough) and toolbox (databricks-tools)
# are created out-of-band by setup/Create-Connection-And-Toolbox.ps1, because the OAuth2
# identity-passthrough connection needs an Entra app client id + secret and the Entra
# authorize/token endpoints. This manifest defines only the hosted agent; at runtime the
# agent reaches the toolbox with its own agent identity via TOOLBOX_NAME.
requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: agent-framework-agent-databricks
services:
    agent-framework-agent-databricks:
        project: src/agent-framework-agent-databricks
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: An Agent Framework hosted agent that answers questions over an Azure Databricks Genie space on behalf of the signed-in user.
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: TOOLBOX_NAME
              value: databricks-tools
            - name: ENABLE_TOOLBOX
              value: "true"
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Streaming
                - Azure Databricks
                - Genie
        name: agent-framework-agent-databricks
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        # Target project comes from `azd env` / --project-endpoint; no tenant-specific
        # endpoint is committed here.
        deployments: []
infra:
    provider: microsoft.foundry
